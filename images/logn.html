<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Admin Login</title>
  <style>
    :root {
      --bg: #0b1330;
      --card: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --input-bg: #f2f6ff;
      --input-border: #dbe3f0;
      --btn-bg: #7c54ff;
      --btn-shadow: rgba(124, 84, 255, 0.25);
      --shadow: 0 35px 90px rgba(15, 27, 68, 0.4);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 25%),
        radial-gradient(circle at bottom right, rgba(124, 84, 255, 0.12), transparent 18%),
        linear-gradient(180deg, #060b1f 0%, #09172f 45%, #0b2144 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text);
      overflow: hidden;
      position: relative;
    }

    .page-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .page-bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(96px);
      opacity: 0.7;
      animation: drift 14s ease-in-out infinite;
    }

    .page-bg span:nth-child(1) {
      width: 400px;
      height: 400px;
      top: 4%;
      left: 8%;
      background: rgba(124, 84, 255, 0.28);
      animation-duration: 18s;
    }

    .page-bg span:nth-child(2) {
      width: 300px;
      height: 300px;
      top: 24%;
      right: 10%;
      background: rgba(56, 179, 255, 0.22);
      animation-duration: 20s;
    }

    .page-bg span:nth-child(3) {
      width: 260px;
      height: 260px;
      bottom: 12%;
      left: 20%;
      background: rgba(255, 255, 255, 0.14);
      animation-duration: 17s;
    }

    .page-bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.8;
      animation: drift 12s ease-in-out infinite;
    }

    .page-bg span:nth-child(1) {
      width: 340px;
      height: 340px;
      top: 8%;
      left: -5%;
      background: rgba(124, 84, 255, 0.28);
      animation-duration: 16s;
    }

    .page-bg span:nth-child(2) {
      width: 260px;
      height: 260px;
      top: 28%;
      right: 5%;
      background: rgba(45, 201, 255, 0.22);
      animation-duration: 18s;
    }

    .page-bg span:nth-child(3) {
      width: 300px;
      height: 300px;
      bottom: 10%;
      left: 15%;
      background: rgba(255, 255, 255, 0.12);
      animation-duration: 20s;
    }

    .login-card {
      width: min(540px, 100%);
      background: rgba(255, 255, 255, 0.98);
      border-radius: 30px;
      padding: 3rem 2.5rem 2.5rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(124, 84, 255, 0.14), transparent 24%),
        radial-gradient(circle at bottom right, rgba(69, 179, 255, 0.1), transparent 18%);
      pointer-events: none;
    }

    .login-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      top: 10%;
      right: -70px;
      background: rgba(124, 84, 255, 0.12);
      border-radius: 50%;
      filter: blur(28px);
      pointer-events: none;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .brand img,
    .brand h2 {
      max-height: 72px;
    }

    .brand h2 {
      font-size: 1.75rem;
      letter-spacing: -0.04em;
      margin: 0;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      z-index: 1;
    }

    .login-header h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.75;
      max-width: 420px;
      margin: 0 auto;
    }

    .login-content {
      display: grid;
      gap: 1.2rem;
      position: relative;
      z-index: 1;
    }

    .field {
      display: grid;
      gap: 0.6rem;
    }

    .field label {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .field-inner {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 18px;
      padding: 0.9rem 1rem;
    }

    .field-inner input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .field-inner span {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(124, 84, 255, 0.12);
      color: var(--btn-bg);
      font-size: 1.05rem;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .remember input {
      accent-color: var(--btn-bg);
    }

    .actions a {
      color: var(--btn-bg);
      text-decoration: none;
      font-weight: 600;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem 1.2rem;
      border: none;
      border-radius: 16px;
      background: var(--btn-bg);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 20px 30px rgba(124, 84, 255, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 40px rgba(124, 84, 255, 0.32);
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-10px, -15px) scale(1.05); }
      50% { transform: translate(6px, 12px) scale(1.02); }
      75% { transform: translate(-4px, 8px) scale(1.03); }
    }

    .footer {
      margin-top: 1.4rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
    }

    .footer a {
      color: var(--btn-bg);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 540px) {
      body {
        padding: 1.2rem;
      }

      .login-card {
        padding: 2rem 1.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="login-card">
    <div class="brand">
      <h2>THE XOOMBOX</h2>
    </div>

    <div class="login-header">
      <h1>Super Admin Login</h1>
      <p>Sign in to access the admin dashboard and manage your system with secure credentials.</p>
    </div>

    <form class="login-content" action="#" method="post">
      <div class="field">
        <label for="email">Email address</label>
        <div class="field-inner">
          <span>👤</span>
          <input id="email" name="email" type="email" placeholder="umesh@gmail.com" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="field-inner">
          <span>🔒</span>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
      </div>

      <div class="actions">
        <label class="remember">
          <input type="checkbox" name="remember" /> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="submit-btn" type="submit">SIGN IN</button>
    </form>

    <div class="footer">
      New to the dashboard? <a href="#">Create account</a>
    </div>
  </div>
</body>
</html>
